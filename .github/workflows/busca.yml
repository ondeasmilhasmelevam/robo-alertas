name: Busca de alertas

# ORCAMENTO DA API — leia antes de mexer nos horarios.
# A conta da seats.aero da 1000 chamadas por dia. Medido em 26/11/2026:
#   varredura COMPLETA (14 programas x 3 cabines) ... ~350 chamadas
#   varredura AVIOS    (iberia/british/qatar)     ...  ~65 chamadas
# Por isso 5 varreduras completas por dia NAO cabem (seriam 1750). O desenho:
#   21h -> completa (~350) + 0h, 2h, 3h e 6h -> avios (~65 cada) = ~610/dia,
# sobrando uns 390 pra voce forcar busca a mao quando quiser.
# Desde 27/11/2026 uma busca so serve os 5 grupos (ver iniciar_cache_do_ciclo
# no engine.py), entao ligar os grupos nao mexeu nessa conta.
#
# POR QUE BATE DE 20 EM 20 MINUTOS
# O cron do GitHub em repositorio gratuito atrasa e engole execucao: na noite
# de 26 pra 27/11/2026, das 4 batidas devidas so 1 aconteceu, e com 6h33 de
# atraso. Entao o relogio do GitHub nao decide mais nada — ele so bate na
# porta. Quem decide e o decidir_busca.py, que olha a hora de Brasilia e o
# arquivo ultima_busca.txt e responde se algum horario do dia ja passou e
# ainda nao foi feito (com 90 min de tolerancia). Pra um horario se perder,
# o GitHub teria de engolir cinco batidas seguidas.
# Os horarios de verdade estao no decidir_busca.py, nao aqui.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "O que buscar"
        type: choice
        options: [completo, avios]
        default: completo
      teste:
        description: "Modo teste (nao envia nada pro Telegram)"
        type: boolean
        default: false
      canal:
        description: "Rodar so um canal (parte do nome). Vazio = todos"
        type: string
        default: ""

permissions:
  contents: write   # para gravar de volta o historico de alertas enviados

jobs:
  # Trabalho curto (uns 20 segundos) que roda a cada batida so pra responder
  # "esta na hora?". So quando a resposta e sim e que a busca de verdade sobe.
  decidir:
    runs-on: ubuntu-latest
    outputs:
      rodar: ${{ steps.relogio.outputs.rodar }}
      modo:  ${{ steps.relogio.outputs.modo }}
      marca: ${{ steps.relogio.outputs.marca }}
    steps:
      - uses: actions/checkout@v4
      - id: relogio
        env:
          MODO_BOTAO: ${{ inputs.modo }}
        run: python3 decidir_busca.py

  buscar:
    needs: decidir
    if: needs.decidir.outputs.rodar == 'sim'
    runs-on: ubuntu-latest
    timeout-minutes: 50

    # Uma busca por vez: duas ao mesmo tempo brigariam pelo historico.
    # Fica no trabalho, nao no workflow inteiro, pra que as batidas de 20 em
    # 20 minutos nunca entrem em fila atras de uma busca em andamento.
    concurrency:
      group: busca-alertas
      cancel-in-progress: false

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # O historico de precos (4,6 MB) e grande pra ficar no git, entao mora
      # no cache do Actions. A chave muda a cada execucao pra sempre gravar
      # uma versao nova; o restore-keys pega a mais recente que existir.
      - name: Recuperar historico de precos
        uses: actions/cache@v4
        with:
          path: |
            pricing_history.json
            price_records.json
          key: precos-${{ github.run_id }}
          restore-keys: |
            precos-

      - name: Montar o channels_config.json a partir dos Secrets
        env:
          CHANNELS_CONFIG: ${{ secrets.CHANNELS_CONFIG }}
        run: |
          if [ -z "$CHANNELS_CONFIG" ]; then
            echo "::error::O Secret CHANNELS_CONFIG esta vazio. Cole nele o conteudo do channels_config.json."
            exit 1
          fi
          printf '%s' "$CHANNELS_CONFIG" > channels_config.json
          python - <<'PY'
          import json
          d = json.load(open('channels_config.json', encoding='utf-8'))
          canais = (d.get('channels') if isinstance(d, dict) else d) or []
          ligados = [c for c in canais if c.get('enabled')]
          print(f"channels_config.json OK - {len(ligados)} de {len(canais)} grupos ligados:")
          for c in ligados:
              print("  -", c.get('name', '(sem nome)'))
          PY

      - name: Rodar a busca
        env:
          MODO:                 ${{ needs.decidir.outputs.modo }}
          SEATS_API_KEY:        ${{ secrets.SEATS_API_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID:      ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH:    ${{ secrets.TELEGRAM_API_HASH }}
          DISCORD_WEBHOOK:      ${{ secrets.DISCORD_WEBHOOK }}
          ROVE_SESSION_COOKIE:  ${{ secrets.ROVE_SESSION_COOKIE }}
          ROVE_COOKIE_HEADER:   ${{ secrets.ROVE_COOKIE_HEADER }}
          ROVE_ANON_KEY:        ${{ secrets.ROVE_ANON_KEY }}
          ROVE_REFRESH_TOKEN:   ${{ secrets.ROVE_REFRESH_TOKEN }}
          AVIOS_ADMIN_CHAT:     ${{ secrets.AVIOS_ADMIN_CHAT }}
          TESTE:                ${{ inputs.teste }}
          CANAL:                ${{ inputs.canal }}
          PYTHONUNBUFFERED: "1"
        run: |
          ARGS="--modo $MODO"
          if [ "$TESTE" = "true" ]; then ARGS="$ARGS --teste"; fi
          if [ -n "$CANAL" ]; then ARGS="$ARGS --canal $CANAL"; fi
          echo "python run_cycle.py $ARGS"
          python run_cycle.py $ARGS

      # So depois que a busca terminou bem e que o horario conta como feito.
      # Se ela quebrou no meio, o marcador fica como estava e a proxima batida
      # (dentro da tolerancia) tenta de novo.
      - name: Marcar o horario como feito
        if: success() && needs.decidir.outputs.marca != ''
        run: |
          printf '%s\n' "${{ needs.decidir.outputs.marca }}" > ultima_busca.txt
          echo "Horario ${{ needs.decidir.outputs.marca }} marcado como feito."

      - name: Enxugar o historico de precos
        if: always()
        run: python compactar_estado.py || true

      # Volta pro repositorio: o historico de alertas enviados (e ele que evita
      # repetir alerta), o ultima_busca.txt (o relogio do decidir_busca.py) e o
      # alertas_site.json, que e o arquivo que o SITE le pra mostrar as
      # passagens (ver publicar_site.py).
      - name: Guardar o historico de alertas no repositorio
        if: always()
        run: |
          git config user.name  "robo-alertas"
          git config user.email "robo-alertas@users.noreply.github.com"
          git add historico_*.json md_history.json vmm_reposted.json alertas_site.json ultima_busca.txt || true
          if git diff --cached --quiet; then
            echo "Nada mudou no historico."
          else
            git commit -m "historico: ${{ needs.decidir.outputs.modo }} em $(date -u '+%d/%m/%Y %H:%M') UTC"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi

      - name: Guardar o log pra conferir depois
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ github.run_id }}
          path: |
            *.log
          if-no-files-found: ignore
          retention-days: 7
