name: Busca de alertas

# ORCAMENTO DA API — leia antes de mexer nos horarios.
# A conta da seats.aero da 1000 chamadas por dia. Medido em 26/11/2026:
#   varredura COMPLETA (14 programas x 3 cabines) ... ~350 chamadas
#   varredura AVIOS    (iberia/british/qatar)     ...  ~65 chamadas
# Por isso 5 varreduras completas por dia NAO cabem (seriam 1750). O desenho:
#   21h -> completa (~400) + 0h, 2h, 3h e 6h -> avios (~75 cada)
#   9h  -> completa so nos grupos sem Avios (~150)
# Da uns 850/dia, sobrando pouco pra forcar busca a mao: antes de acrescentar
# horario ou programa, meca o gasto.
# Desde 27/11/2026 uma busca so serve os 5 grupos (iniciar_cache_do_ciclo no
# engine.py), entao ligar os cinco grupos nao mexeu nessa conta.
#
# POR QUE PLANTAO, E NAO AGENDAMENTO
# O cron do GitHub em repositorio gratuito nao atrasa minutos: atrasa HORAS, e
# engole execucao. Medido em 27/11/2026: das 4 batidas devidas na noite
# anterior so 1 aconteceu, com 6h33 de atraso; e a batida das 09:00 UTC saiu as
# 14:38. Depois disso, com agendamento de 20 em 20 minutos, as batidas das
# 15:00 e 15:20 simplesmente nao vieram. Nenhuma tolerancia em minutos resolve
# atraso em horas.
# Entao o relogio do GitHub nao decide mais nada. Cada execucao fica de
# PLANTAO por 5h30, olhando a hora de Brasilia de 5 em 5 minutos, e no fim
# chama a proxima com `gh workflow run` — chamada a mao sai na hora, ao
# contrario de agendamento. O agendamento de hora em hora fica so de reserva,
# pra religar a corrente se ela parar. E o mesmo desenho do plantao do site
# (.github/workflows/alertas.yml), que funciona ha meses.
# Quem sabe os horarios e o decidir_busca.py, nao este arquivo.
on:
  schedule:
    - cron: "17 * * * *"   # reserva: religa o plantao se a corrente parar
  workflow_dispatch:
    inputs:
      modo:
        description: "O que buscar"
        type: choice
        options: [completo, avios]
        default: completo
      teste:
        description: "Modo teste (nao envia nada pro Telegram)"
        type: boolean
        default: false
      canal:
        description: "Rodar so um canal (parte do nome). Vazio = todos"
        type: string
        default: ""
      plantao:
        description: "Nao marque: e o proprio robo chamando o proximo plantao"
        type: boolean
        default: false

permissions:
  contents: write   # para gravar de volta o historico de alertas enviados
  actions: write    # para chamar o proximo plantao

concurrency:
  group: busca-alertas
  # Um plantao por vez. Quem aperta "Run workflow" fura a fila: cancela o
  # plantao que esta so esperando a proxima hora, em vez de ficar na fila
  # atras dele por ate 5h30. O plantao que o robo chama (plantao=true) nao
  # cancela ninguem: espera o anterior terminar.
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && inputs.plantao != true }}

jobs:
  plantao:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # O historico de precos (4,6 MB) e grande pra ficar no git, entao mora
      # no cache do Actions. A chave muda a cada execucao pra sempre gravar
      # uma versao nova; o restore-keys pega a mais recente que existir.
      - name: Recuperar historico de precos
        uses: actions/cache@v4
        with:
          path: |
            pricing_history.json
            price_records.json
          key: precos-${{ github.run_id }}
          restore-keys: |
            precos-

      - name: Montar o channels_config.json a partir dos Secrets
        env:
          CHANNELS_CONFIG: ${{ secrets.CHANNELS_CONFIG }}
        run: |
          if [ -z "$CHANNELS_CONFIG" ]; then
            echo "::error::O Secret CHANNELS_CONFIG esta vazio. Cole nele o conteudo do channels_config.json."
            exit 1
          fi
          printf '%s' "$CHANNELS_CONFIG" > channels_config.json
          python - <<'PY'
          import json
          d = json.load(open('channels_config.json', encoding='utf-8'))
          canais = (d.get('channels') if isinstance(d, dict) else d) or []
          ligados = [c for c in canais if c.get('enabled')]
          print(f"channels_config.json OK - {len(ligados)} de {len(canais)} grupos ligados:")
          for c in ligados:
              print("  -", c.get('name', '(sem nome)'))
          PY

      - name: Plantao
        env:
          EVENTO:               ${{ github.event_name }}
          E_PLANTAO:            ${{ inputs.plantao }}
          MODO_INPUT:           ${{ inputs.modo }}
          TESTE:                ${{ inputs.teste }}
          CANAL:                ${{ inputs.canal }}
          RAMO:                 ${{ github.ref_name }}
          SEATS_API_KEY:        ${{ secrets.SEATS_API_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID:      ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH:    ${{ secrets.TELEGRAM_API_HASH }}
          DISCORD_WEBHOOK:      ${{ secrets.DISCORD_WEBHOOK }}
          ROVE_SESSION_COOKIE:  ${{ secrets.ROVE_SESSION_COOKIE }}
          ROVE_COOKIE_HEADER:   ${{ secrets.ROVE_COOKIE_HEADER }}
          ROVE_ANON_KEY:        ${{ secrets.ROVE_ANON_KEY }}
          ROVE_REFRESH_TOKEN:   ${{ secrets.ROVE_REFRESH_TOKEN }}
          AVIOS_ADMIN_CHAT:     ${{ secrets.AVIOS_ADMIN_CHAT }}
          PYTHONUNBUFFERED: "1"
        run: |
          git config user.name  "robo-alertas"
          git config user.email "robo-alertas@users.noreply.github.com"

          # Roda uma busca e guarda o resultado.
          #   $1 = modo (completo/avios)
          #   $2 = marca do horario ("" quando foi pedido a mao, que nao
          #        consome o horario do dia)
          #   $3 = quem ("sem-avios" = so os grupos que nao tem
          #        iberia/british/qatar; vazio = todos os grupos ligados)
          rodar_busca() {
            MODO="$1"; MARCA="$2"; QUEM="$3"
            ARGS="--modo $MODO"
            if [ "$QUEM" = "sem-avios" ]; then ARGS="$ARGS --grupos-sem-avios"; fi
            if [ "$TESTE" = "true" ]; then ARGS="$ARGS --teste"; fi
            if [ -n "$CANAL" ]; then ARGS="$ARGS --canal $CANAL"; fi
            echo "::group::busca $MODO $(date -u '+%H:%M') UTC"
            echo "python run_cycle.py $ARGS"
            if python run_cycle.py $ARGS; then
              # So conta como feito se terminou bem; se quebrou no meio, a
              # volta seguinte do plantao tenta de novo.
              if [ -n "$MARCA" ]; then printf '%s\n' "$MARCA" > ultima_busca.txt; fi
            else
              echo "::warning::a busca de $MODO falhou; o horario fica pra proxima volta."
            fi
            echo "::endgroup::"

            python compactar_estado.py || true

            # Volta pro repositorio: o historico de alertas enviados (e ele que
            # evita repetir alerta), o ultima_busca.txt (o relogio do
            # decidir_busca.py), o cota_seats.txt (quanto sobrou da API hoje,
            # que e o que faz o horario das 9h ceder a vez quando aperta) e o
            # alertas_site.json, que e o arquivo que o SITE le pra mostrar as
            # passagens (ver publicar_site.py).
            git add historico_*.json md_history.json vmm_reposted.json alertas_site.json ultima_busca.txt cota_seats.txt || true
            if git diff --cached --quiet; then
              echo "Nada mudou no historico."
            else
              git commit -q -m "historico: $MODO em $(date -u '+%d/%m/%Y %H:%M') UTC"
              git pull -q --rebase --autostash origin "$RAMO" || true
              git push -q || echo "::warning::nao deu pra enviar o historico agora; vai na proxima."
            fi
          }

          # Pedido a mao pelo botao "Run workflow": roda uma vez e sai. O passo
          # seguinte levanta um plantao novo no lugar do que foi cancelado.
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$E_PLANTAO" != "true" ]; then
            echo "Busca pedida a mao: $MODO_INPUT"
            rodar_busca "$MODO_INPUT" "" ""
            exit 0
          fi

          # Plantao: 5h30, deixando folga pra chamar o proximo antes do
          # timeout de 350 minutos.
          fim=$(( $(date +%s) + 330*60 ))
          echo "Plantao ligado ate $(date -u -d "@$fim" '+%H:%M') UTC."

          while [ "$(date +%s)" -lt "$fim" ]; do
            saida="$(python decidir_busca.py)"
            echo "$saida" | grep -v '^DECISAO='
            decisao="$(echo "$saida" | grep '^DECISAO=' | tail -1 | cut -d= -f2-)"
            if [ "$(echo "$decisao" | cut -d'|' -f1)" = "sim" ]; then
              rodar_busca "$(echo "$decisao" | cut -d'|' -f2)" \
                          "$(echo "$decisao" | cut -d'|' -f3)" \
                          "$(echo "$decisao" | cut -d'|' -f4)"
            fi
            sleep 300
          done
          echo "Plantao cumprido; chamando o proximo."

      - name: Chamar o proximo plantao
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run busca.yml --ref "${{ github.ref_name }}" -f plantao=true

      - name: Guardar o log pra conferir depois
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ github.run_id }}
          path: |
            *.log
          if-no-files-found: ignore
          retention-days: 7
